<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Resume Screener</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
      <a class="navbar-brand" href="#">AI Resume Screener</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-lg p-4">
          <h3 class="card-title text-center mb-4">Upload Resume</h3>
          <form action="/analyze" method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="resume" class="form-label">Resume (PDF)</label>
              <input type="file" class="form-control" name="resume" id="resume" accept=".pdf" required>
            </div>
            <div class="mb-3">
              <label for="job_description" class="form-label">Job Description</label>
              <textarea class="form-control" name="job_description" id="job_description" rows="6" placeholder="Paste the job description here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Analyze Resume</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-light text-center mt-5 py-3">
    <p class="mb-0">© 2025 AI Resume Screener | Developed by Tasertip</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
