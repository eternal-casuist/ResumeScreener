<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result - AI Resume Screener</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
      <a class="navbar-brand" href="/">AI Resume Screener</a>
    </div>
  </nav>

  <!-- Result Content -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-lg p-4 text-center">
          <h3 class="card-title mb-4">Resume Analysis Result</h3>
          <p class="mb-2">Your resume matches the job description by:</p>
          <h1 class="display-3 text-success">{{ score }}%</h1>
          <a href="/" class="btn btn-outline-primary mt-4 w-100">Analyze Another Resume</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-light text-center mt-5 py-3">
    <p class="mb-0">© 2025 AI Resume Screener | Developed by Tasertip</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
